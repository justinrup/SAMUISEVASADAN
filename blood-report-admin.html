<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAB REPORTING SOFTWARE - SAMUI SEVA SADAN</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#17202a;
}
header{
 background:linear-gradient(135deg,#075e54,#128c7e);
 color:white;
 padding:18px;
 position:sticky;
 top:0;
 z-index:50;
 box-shadow:0 3px 12px #0003;
}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:13px}

.wrap{max-width:1200px;margin:auto;padding:14px}

.menu{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:8px 0 14px;
}
.menu button{
 border:0;
 padding:10px 13px;
 border-radius:20px;
 background:white;
 box-shadow:0 2px 7px #0002;
 white-space:nowrap;
 cursor:pointer;
}
.menu button.active{
 background:#075e54;
 color:white;
}

.panel{
 background:white;
 border-radius:16px;
 padding:16px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #0001;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:12px;
}
label{font-weight:bold;font-size:13px}
input,select,textarea{
 width:100%;
 padding:11px;
 margin-top:5px;
 border:1px solid #ccd5df;
 border-radius:9px;
 font-size:15px;
}
textarea{min-height:90px;resize:vertical}

.test-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px;
}
.test{
 border:1px solid #e1e6eb;
 padding:11px;
 border-radius:10px;
 background:#fafcff;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:15px;
}
.btn{
 border:0;
 border-radius:9px;
 padding:11px 16px;
 color:white;
 cursor:pointer;
 font-weight:bold;
}
.save{background:#1565c0}
.publish{background:#198754}
.edit{background:#6f42c1}
.delete{background:#dc3545}
.print{background:#333}
.clear{background:#777}

.saved{
 border:1px solid #ddd;
 border-radius:12px;
 padding:12px;
 margin:9px 0;
}
.status{
 display:inline-block;
 padding:4px 8px;
 border-radius:12px;
 font-size:12px;
 background:#eee;
}
.pub{background:#d9f7e8;color:#087443}
.draft{background:#fff0c7;color:#805b00}
.msg{
 padding:10px;
 border-radius:9px;
 margin-top:10px;
 display:none;
 background:#e8f5e9;
 color:#17652a;
}
h2{margin-top:0}
.small{font-size:12px;color:#666}
</style>
</head>

<body>

<header>
<h1>🔬 LAB REPORTING SOFTWARE</h1>
<p>SAMUI SEVA SADAN • Laboratory Report Management</p>
</header>

<div class="wrap">

<div class="panel">
<h2>📋 Report Type</h2>

<div class="menu" id="reportMenu"></div>
</div>

<div class="panel">

<h2 id="formTitle">CBC / Complete Blood Count</h2>

<div class="grid">

<div>
<label>Mother / Patient Name *</label>
<input id="patientName" placeholder="Enter name">
</div>

<div>
<label>Mother Aadhaar No.</label>
<input id="aadhaar" placeholder="0000 0000 0000"
       inputmode="numeric" maxlength="14">
</div>

<div>
<label>Age</label>
<input id="age" placeholder="Age">
</div>

<div>
<label>Sex</label>
<select id="sex">
<option value="">Select</option>
<option>Female</option>
<option>Male</option>
<option>Other</option>
</select>
</div>

<div>
<label>Sample Date</label>
<input id="sampleDate" type="date">
</div>

<div>
<label>Lab / Accession No.</label>
<input id="labNo" placeholder="Lab number">
</div>

<div>
<label>Referring Doctor</label>
<input id="doctor" placeholder="Doctor name">
</div>

<div>
<label>Specimen</label>
<input id="specimen" placeholder="Blood / Serum / Urine etc.">
</div>

</div>

<hr>

<h3 id="testHeading">CBC Results</h3>

<div class="test-grid" id="testFields"></div>

<div>
<label>Remarks / Interpretation</label>
<textarea id="remarks" placeholder="Enter laboratory remarks"></textarea>
</div>

<div id="msg" class="msg"></div>

<div class="actions">
<button class="btn save" onclick="saveReport()">💾 Save</button>
<button class="btn edit" onclick="editCurrent()">✏️ Edit</button>
<button class="btn publish" onclick="publishReport()">✓ Publish</button>
<button class="btn delete" onclick="deleteCurrent()">🗑️ Delete</button>
<button class="btn print" onclick="printReport()">🖨️ Print</button>
<button class="btn clear" onclick="clearForm()">＋ New Report</button>
</div>

</div>

<div class="panel">
<h2>📂 Saved Laboratory Reports</h2>
<div id="savedReports"></div>
</div>

</div>

<script>
const KEY="sss_blood_reports";

const REPORTS={

"CBC":{
 name:"CBC / Complete Blood Count",
 fields:[
 ["Hemoglobin","g/dL"],["RBC Count","million/µL"],
 ["WBC Count","/µL"],["Platelet Count","/µL"],
 ["HCT / PCV","%"],["MCV","fL"],
 ["MCH","pg"],["MCHC","g/dL"],
 ["RDW","%"],["Neutrophils","%"],
 ["Lymphocytes","%"],["Monocytes","%"],
 ["Eosinophils","%"],["Basophils","%"]
 ]},

"SUGAR":{
 name:"Blood Sugar",
 fields:[
 ["Fasting Blood Sugar","mg/dL"],
 ["Post Prandial Blood Sugar","mg/dL"],
 ["Random Blood Sugar","mg/dL"]
 ]},

"HBA1C":{
 name:"HbA1c",
 fields:[
 ["HbA1c","%"],["Estimated Average Glucose","mg/dL"]
 ]},

"LIPID":{
 name:"Lipid Profile",
 fields:[
 ["Total Cholesterol","mg/dL"],["Triglycerides","mg/dL"],
 ["HDL Cholesterol","mg/dL"],["LDL Cholesterol","mg/dL"],
 ["VLDL Cholesterol","mg/dL"],["TC / HDL Ratio",""]
 ]},

"LFT":{
 name:"Liver Function Test",
 fields:[
 ["Total Bilirubin","mg/dL"],["Direct Bilirubin","mg/dL"],
 ["Indirect Bilirubin","mg/dL"],["SGOT / AST","U/L"],
 ["SGPT / ALT","U/L"],["ALP","U/L"],
 ["Total Protein","g/dL"],["Albumin","g/dL"],
 ["Globulin","g/dL"]
 ]},

"KFT":{
 name:"Kidney / Renal Function Test",
 fields:[
 ["Blood Urea","mg/dL"],["Serum Creatinine","mg/dL"],
 ["Uric Acid","mg/dL"],["eGFR","mL/min"],
 ["Sodium","mmol/L"],["Potassium","mmol/L"],
 ["Chloride","mmol/L"]
 ]},

"THYROID":{
 name:"Thyroid Profile",
 fields:[
 ["TSH","µIU/mL"],["T3","ng/mL"],
 ["T4","µg/dL"],["Free T3","pg/mL"],
 ["Free T4","ng/dL"]
 ]},

"URINE":{
 name:"Urine Routine / Microscopy",
 fields:[
 ["Colour",""],["Appearance",""],["pH",""],
 ["Specific Gravity",""],["Protein",""],
 ["Sugar",""],["Ketone",""],["Blood",""],
 ["Pus Cells","/HPF"],["RBC","/HPF"],
 ["Epithelial Cells","/HPF"],["Bacteria",""]
 ]},

"STOOL":{
 name:"Stool Routine",
 fields:[
 ["Colour",""],["Consistency",""],
 ["Occult Blood",""],["Mucus",""],
 ["Ova / Parasite",""],["RBC","/HPF"],
 ["Pus Cells","/HPF"]
 ]},

"ESR":{
 name:"ESR",
 fields:[["ESR","mm/hr"]]
},

"CRP":{
 name:"CRP",
 fields:[["CRP","mg/L"]]
},

"GROUP":{
 name:"Blood Group",
 fields:[
 ["ABO Group",""],["Rh Factor",""]
 ]},

"ELECTROLYTE":{
 name:"Electrolytes",
 fields:[
 ["Sodium","mmol/L"],["Potassium","mmol/L"],
 ["Chloride","mmol/L"],["Bicarbonate","mmol/L"]
 ]},

"CALCIUM":{
 name:"Calcium",
 fields:[
 ["Total Calcium","mg/dL"],["Ionized Calcium","mmol/L"]
 ]},

"URIC":{
 name:"Uric Acid",
 fields:[["Uric Acid","mg/dL"]]
},

"BILIRUBIN":{
 name:"Bilirubin",
 fields:[
 ["Total Bilirubin","mg/dL"],
 ["Direct Bilirubin","mg/dL"],
 ["Indirect Bilirubin","mg/dL"]
 ]},

"AMYLASE":{
 name:"Amylase",
 fields:[["Amylase","U/L"]]
},

"LIPASE":{
 name:"Lipase",
 fields:[["Lipase","U/L"]]
},

"PREGNANCY":{
 name:"Pregnancy Test",
 fields:[
 ["Test",""],
 ["Result",""]
 ]},

"DENGUE":{
 name:"Dengue Test",
 fields:[
 ["NS1 Antigen",""],
 ["IgM Antibody",""],
 ["IgG Antibody",""]
 ]},

"MALARIA":{
 name:"Malaria Test",
 fields:[
 ["Parasite / Antigen",""],
 ["Result",""]
 ]},

"WIDAL":{
 name:"Widal Test",
 fields:[
 ["Salmonella Typhi O",""],
 ["Salmonella Typhi H",""],
 ["Salmonella Paratyphi AH",""],
 ["Salmonella Paratyphi BH",""]
 ]},

"OTHER":{
 name:"Other / Custom Laboratory Report",
 fields:[
 ["Test 1",""],["Test 2",""],["Test 3",""],
 ["Test 4",""],["Test 5",""],["Test 6",""]
 ]}
};

let currentType="CBC";
let currentId=null;

function getAll(){
 try{return JSON.parse(localStorage.getItem(KEY)||"[]")}
 catch(e){return []}
}

function saveAll(x){
 localStorage.setItem(KEY,JSON.stringify(x));
}

function formatAadhaar(v){
 v=(v||"").replace(/\D/g,"").slice(0,12);
 return v.replace(/(\d{4})(?=\d)/g,"$1 ").trim();
}

document.getElementById("aadhaar").addEventListener("input",function(){
 this.value=formatAadhaar(this.value);
});

function buildMenu(){

 const menu=document.getElementById("reportMenu");

 menu.innerHTML=Object.entries(REPORTS).map(([key,r])=>
 `<button class="${key===currentType?"active":""}"
 onclick="selectType('${key}')">${r.name}</button>`
 ).join("");
}

function selectType(type){

 currentType=type;
 currentId=null;

 document.getElementById("formTitle").textContent=REPORTS[type].name;
 document.getElementById("testHeading").textContent=REPORTS[type].name+" Results";

 buildMenu();
 buildFields();
 clearValuesOnly();
}

function buildFields(){

 const box=document.getElementById("testFields");
 const fields=REPORTS[currentType].fields;

 box.innerHTML=fields.map((f,i)=>`
 <div class="test">
   <label>${f[0]}</label>
   <input id="test_${i}" placeholder="${f[1]||""}">
   ${f[1]?`<div class="small">Unit: ${f[1]}</div>`:""}
 </div>
 `).join("");
}

function clearValuesOnly(){

 document.getElementById("patientName").value="";
 document.getElementById("aadhaar").value="";
 document.getElementById("age").value="";
 document.getElementById("sex").value="";
 document.getElementById("sampleDate").value="";
 document.getElementById("labNo").value="";
 document.getElementById("doctor").value="";
 document.getElementById("specimen").value="";
 document.getElementById("remarks").value="";

 REPORTS[currentType].fields.forEach((f,i)=>{
   const el=document.getElementById("test_"+i);
   if(el)el.value="";
 });

 currentId=null;
}

function collect(){

 const results={};

 REPORTS[currentType].fields.forEach((f,i)=>{
   const el=document.getElementById("test_"+i);
   results[f[0]]=el?el.value:"";
 });

 return {
   id:currentId||Date.now().toString(),
   type:currentType,
   reportType:REPORTS[currentType].name,
   patientName:document.getElementById("patientName").value.trim(),
   patientNameKey:document.getElementById("patientName").value.trim().toLowerCase(),
   aadhaar:document.getElementById("aadhaar").value.trim(),
   age:document.getElementById("age").value.trim(),
   sex:document.getElementById("sex").value,
   sampleDate:document.getElementById("sampleDate").value,
   labNo:document.getElementById("labNo").value.trim(),
   doctor:document.getElementById("doctor").value.trim(),
   specimen:document.getElementById("specimen").value.trim(),
   results:results,
   remarks:document.getElementById("remarks").value.trim(),
   status:"draft",
   updatedAt:new Date().toISOString()
 };
}

function showMsg(t){
 const m=document.getElementById("msg");
 m.textContent=t;
 m.style.display="block";
 setTimeout(()=>m.style.display="none",2500);
}

function saveReport(){

 const r=collect();

 if(!r.patientName){
   alert("Mother / Patient Name দিন।");
   return;
 }

 let arr=getAll();
 const i=arr.findIndex(x=>x.id===r.id);

 if(i>=0){
   r.status=arr[i].status||"draft";
   r.publishedAt=arr[i].publishedAt||null;
   arr[i]=r;
 }else{
   arr.push(r);
 }

 currentId=r.id;
 saveAll(arr);
 renderSaved();
 showMsg("Report saved successfully.");
}

function publishReport(){

 const r=collect();

 if(!r.patientName){
   alert("Mother / Patient Name দিন।");
   return;
 }

 let arr=getAll();
 const i=arr.findIndex(x=>x.id===r.id);

 r.status="published";
 r.publishedAt=new Date().toISOString();

 if(i>=0)arr[i]=r;
 else arr.push(r);

 currentId=r.id;

 saveAll(arr);
 renderSaved();
 showMsg("Report published successfully.");
}

function editCurrent(){
 if(!currentId){
   alert("আগে একটি saved report থেকে Edit করুন।");
   return;
 }
 showMsg("Report loaded. পরিবর্তন করে Save করুন।");
}

function loadReport(id){

 const r=getAll().find(x=>x.id===id);
 if(!r)return;

 currentType=r.type||"OTHER";
 currentId=r.id;

 document.getElementById("formTitle").textContent=
 REPORTS[currentType]?.name||r.reportType;

 document.getElementById("testHeading").textContent=
 REPORTS[currentType]?.name||r.reportType;

 buildMenu();
 buildFields();

 document.getElementById("patientName").value=r.patientName||"";
 document.getElementById("aadhaar").value=r.aadhaar||"";
 document.getElementById("age").value=r.age||"";
 document.getElementById("sex").value=r.sex||"";
 document.getElementById("sampleDate").value=r.sampleDate||"";
 document.getElementById("labNo").value=r.labNo||"";
 document.getElementById("doctor").value=r.doctor||"";
 document.getElementById("specimen").value=r.specimen||"";
 document.getElementById("remarks").value=r.remarks||"";

 (REPORTS[currentType]?.fields||[]).forEach((f,i)=>{
   const el=document.getElementById("test_"+i);
   if(el)el.value=(r.results||{})[f[0]]||"";
 });

 window.scrollTo({top:0,behavior:"smooth"});
}

function editSaved(id){
 loadReport(id);
 showMsg("Report loaded for editing.");
}

function deleteSaved(id){

 if(!confirm("এই Blood Report delete করবেন?"))return;

 saveAll(getAll().filter(x=>x.id!==id));

 if(currentId===id)clearValuesOnly();

 renderSaved();
}

function deleteCurrent(){

 if(!currentId){
   clearValuesOnly();
   return;
 }

 deleteSaved(currentId);
}

function maskAadhaar(a){

 const d=(a||"").replace(/\D/g,"");

 if(d.length===12)
   return "XXXX XXXX "+d.slice(-4);

 return a||"";
}

function printSaved(id){

 const r=getAll().find(x=>x.id===id);
 if(!r)return;

 printReportObject(r);
}

function printReport(){

 const r=collect();

 if(!r.patientName){
   alert("Mother / Patient Name দিন।");
   return;
 }

 printReportObject(r);
}

function printReportObject(r){

 const tests=Object.entries(r.results||{}).map(([k,v])=>
 `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`
 ).join("");

 const w=window.open("","_blank","width=900,height=700");

 if(!w){
   alert("Please allow pop-ups to print the report.");
   return;
 }

 w.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>Laboratory Report</title>
<style>
body{font-family:Arial;padding:30px}
h1{text-align:center}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{border:1px solid #999;padding:9px}
.info{line-height:1.8}
</style>
</head>
<body>
<h1>SAMUI SEVA SADAN</h1>
<h2 style="text-align:center">${esc(r.reportType)}</h2>

<div class="info">
<b>Mother / Patient:</b> ${esc(r.patientName)}<br>
<b>Aadhaar:</b> ${maskAadhaar(r.aadhaar)}<br>
<b>Age / Sex:</b> ${esc(r.age)} / ${esc(r.sex)}<br>
<b>Sample Date:</b> ${esc(r.sampleDate)}<br>
<b>Lab No:</b> ${esc(r.labNo)}<br>
<b>Referring Doctor:</b> ${esc(r.doctor)}<br>
<b>Specimen:</b> ${esc(r.specimen)}
</div>

<table>
<tr><th>Test</th><th>Result</th></tr>
${tests}
</table>

<p><b>Remarks:</b><br>${esc(r.remarks)}</p>

<br><br>
<div style="text-align:right">Authorized Laboratory</div>
</body>
</html>`);

 w.document.close();
 w.focus();

 setTimeout(()=>w.print(),400);
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function clearForm(){
 clearValuesOnly();
 showMsg("New report form ready.");
}

function renderSaved(){

 const box=document.getElementById("savedReports");
 const arr=getAll();

 if(!arr.length){
   box.innerHTML='<p class="small">No laboratory reports saved yet.</p>';
   return;
 }

 box.innerHTML=arr.slice().reverse().map(r=>`

 <div class="saved">

 <b>🔬 ${esc(r.reportType)}</b>

 <div style="margin-top:5px">
 👤 ${esc(r.patientName)}
 </div>

 <div class="small">
 Aadhaar: ${maskAadhaar(r.aadhaar)}
 </div>

 <div style="margin-top:6px">
 <span class="status ${r.status==="published"?"pub":"draft"}">
 ${r.status==="published"?"Published":"Saved / Draft"}
 </span>
 </div>

 <div class="actions">

 <button class="btn edit"
 onclick="editSaved('${r.id}')">✏️ Edit</button>

 <button class="btn publish"
 onclick="publishSaved('${r.id}')">✓ Publish</button>

 <button class="btn print"
 onclick="printSaved('${r.id}')">🖨️ Print</button>

 <button class="btn delete"
 onclick="deleteSaved('${r.id}')">🗑️ Delete</button>

 </div>

 </div>
 `).join("");
}

function publishSaved(id){

 const arr=getAll();
 const r=arr.find(x=>x.id===id);

 if(!r)return;

 r.status="published";
 r.publishedAt=new Date().toISOString();

 saveAll(arr);
 renderSaved();

 showMsg("Report published.");
}

buildMenu();
buildFields();
renderSaved();
</script>

</body>
</html>
