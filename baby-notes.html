<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Baby Note - SAMUI SEVA SADAN</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f8fb;
  color:#222;
}

header{
  background:#0b6b5c;
  color:white;
  padding:18px 15px;
  text-align:center;
}

h1{
  margin:0;
  font-size:24px;
}

.location{
  font-size:13px;
  margin-top:6px;
}

.container{
  max-width:900px;
  margin:20px auto;
  padding:0 15px;
}

.folder{
  background:white;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #0001;
  overflow:hidden;
}

.folder-title{
  background:#e8f4ff;
  padding:16px;
  font-size:19px;
  font-weight:bold;
  color:#0b6b5c;
}

.card{
  padding:18px;
  margin:12px;
  border:1px solid #e5e7eb;
  border-radius:10px;
}

.card h3{
  margin-top:0;
  color:#0b6b5c;
}

.row{
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.label{
  font-weight:bold;
  color:#555;
}

.value{
  margin-top:3px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#666;
}

.back{
  display:inline-block;
  margin-top:10px;
  margin-bottom:30px;
  padding:10px 16px;
  background:#0b6b5c;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>

<style>
.folder-title{
  cursor:pointer;
  user-select:none;
}
.folder.closed .card{
  display:none;
}
</style>

<script>
function toggleBabyFolder(title){
  var folder = title.parentElement;
  folder.classList.toggle("closed");
}
</script>

</head>

<body>

<header>
  <h1>SAMUI SEVA SADAN NURSING HOME</h1>
  <div class="location">
    Khanakul, Hooghly, West Bengal 712417
  </div>
</header>

<div class="container">

  <div id="babyNotesContainer">
    <div class="card">
      <h2>👶 Baby Note</h2>
      <div class="empty">
        Loading published Baby Notes...
      </div>
    </div>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

</div>

<script>
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function folderDate(d){
  if(!d) return "Unknown DOB";

  if(d.indexOf("-") === 4){
    var a=d.split("-");
    if(a.length===3) return a[2]+"-"+a[1]+"-"+a[0];
  }

  return d.replace(/\//g,"-");
}

async function loadPublishedBabyNotes(){

  var container=document.getElementById("babyNotesContainer");

  container.innerHTML=
    '<div class="card">'+
    '<h2>👶 Baby Note</h2>'+
    '<div class="empty">Loading published Baby Notes...</div>'+
    '</div>';

  var records=[];

  try{
    var response=await fetch("/api/site-content/baby_notes", {
      method:"GET",
      credentials:"same-origin",
      cache:"no-store"
    });

    var result=await response.json();
    var content=result && result.content ? result.content : result;

    if(
      response.ok &&
      result &&
      result.ok &&
      content &&
      content.published === true &&
      Array.isArray(content.items)
    ){
      records=content.items;
    }
  }catch(e){
    console.error("Baby Note server load error:",e);
    records=[];
  }

  records=records.filter(function(r){
    return r && (
      r.published === true ||
      r.published === "true" ||
      r.publishedAt
    );
  });

  if(records.length===0){
    container.innerHTML=
      '<div class="card">'+
      '<h2>👶 Baby Note</h2>'+
      '<div class="empty">No Baby Notes have been published yet.</div>'+
      '</div>';
    return;
  }

  var folders={};

  records.forEach(function(record){

    if(!Array.isArray(record.babies)) return;

    record.babies.forEach(function(baby){

      if(!baby) return;

      var dob=baby.dob || "Unknown DOB";

      if(!folders[dob]){
        folders[dob]=[];
      }

      folders[dob].push(baby);
    });
  });

  var dates=Object.keys(folders);

  dates.sort(function(a,b){
    return String(b).localeCompare(String(a));
  });

  if(dates.length===0){
    container.innerHTML=
      '<div class="card">'+
      '<h2>👶 Baby Note</h2>'+
      '<div class="empty">No Baby Notes have been published yet.</div>'+
      '</div>';
    return;
  }

  var output="";

  dates.forEach(function(dob){

    var babies=folders[dob];

    babies.sort(function(a,b){
      return String(a.serial || "").localeCompare(
        String(b.serial || ""),
        undefined,
        {numeric:true}
      );
    });

    output+=
      '<div class="folder">'+
      '<div class="folder-title" onclick="toggleBabyFolder(this)">📁 DOB: '+
      esc(folderDate(dob))+
      '</div>';

    babies.forEach(function(b){

      output+=
        '<div class="card">'+

        '<h3>👶 Baby Serial No. '+
        esc(b.serial || "")+
        '</h3>'+

        '<div class="row"><div class="label">B/O Mother\'s Name</div>'+
        '<div class="value">'+esc(b.mother)+'</div></div>'+

        '<div class="row"><div class="label">DOB</div>'+
        '<div class="value">'+esc(b.dob)+'</div></div>'+

        '<div class="row"><div class="label">Time</div>'+
        '<div class="value">'+esc(b.time)+'</div></div>'+

        '<div class="row"><div class="label">Sex</div>'+
        '<div class="value">'+esc(b.sex)+'</div></div>'+

        '<div class="row"><div class="label">Weight</div>'+
        '<div class="value">'+esc(b.weight)+' kg</div></div>'+

        '<div class="row"><div class="label">OT Type</div>'+
        '<div class="value">'+esc(b.ot)+'</div></div>'+

        '<div class="row"><div class="label">Room</div>'+
        '<div class="value">'+esc(b.room)+'</div></div>'+

        '<div class="row"><div class="label">Bed</div>'+
        '<div class="value">'+esc(b.bed)+'</div></div>'+

        '<div class="row"><div class="label">Doctor Name</div>'+
        '<div class="value">'+esc(b.doctor)+'</div></div>'+

        '<div class="row"><div class="label">Anaesthesia Name</div>'+
        '<div class="value">'+esc(b.anaesthesia)+'</div></div>'+

        '</div>';
    });

    output+='</div>';
  });

  container.innerHTML=output;
}

window.addEventListener("DOMContentLoaded",function(){
  loadPublishedBabyNotes();
});
</script>


</body>
</html>
