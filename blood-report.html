<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blood Report - SAMUI SEVA SADAN</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#17202a;
}
header{
 background:linear-gradient(135deg,#075e54,#128c7e);
 color:white;
 padding:20px 15px;
 text-align:center;
}
header h1{margin:0}
.wrap{max-width:900px;margin:auto;padding:15px}

.search{
 background:white;
 padding:14px;
 border-radius:15px;
 box-shadow:0 2px 10px #0002;
 margin-bottom:15px;
}
.search input{
 width:100%;
 padding:13px;
 border:1px solid #ccd5df;
 border-radius:10px;
 font-size:16px;
}

.folder{
 background:white;
 border-radius:15px;
 margin:12px 0;
 box-shadow:0 2px 10px #0001;
 overflow:hidden;
}
.folder-head{
 padding:15px;
 font-weight:bold;
 font-size:17px;
 cursor:pointer;
 background:#fff;
}
.folder-body{
 padding:0 15px 15px;
 display:none;
}
.report{
 border:1px solid #ddd;
 border-radius:10px;
 padding:12px;
 margin-top:10px;
 background:#fafcff;
}
.report button{
 border:0;
 border-radius:8px;
 padding:9px 12px;
 margin-top:8px;
 cursor:pointer;
}
.empty{
 background:white;
 padding:25px;
 border-radius:15px;
 text-align:center;
 color:#777;
}
.small{font-size:12px;color:#666}

<style id="patient-lab-two-column">
.report-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin:20px 0;
}

.info-card{
  border:1px solid #d9dee7;
  border-radius:12px;
  padding:16px;
  background:#fff;
  box-sizing:border-box;
}

.info-card h3{
  margin:0 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid #e5e7eb;
}

.info-card div{
  margin:7px 0;
  line-height:1.5;
}

@media(max-width:700px){
  .report-info-grid{
    grid-template-columns:1fr;
    gap:12px;
  }
}
</style>

</style>
</head>

<body>

<header>
<h1>🔬 Blood Report</h1>
<div>Published Laboratory Reports</div>
</header>

<div class="wrap">

<div class="search">
<input id="search"
placeholder="🔍 Search by Mother / Patient Name or Aadhaar No."
oninput="render()">
</div>

<div id="list"></div>

</div>

<script>

const KEY="sss_blood_reports";

function getAll(){

 try{
   return JSON.parse(localStorage.getItem(KEY)||"[]")
     .filter(x=>x && x.status==="published");
 }catch(e){
   return [];
 }

}

function norm(v){
 return String(v||"")
 .toLowerCase()
 .replace(/\s+/g,"")
 .replace(/\D/g,"");
}

function maskAadhaar(a){

 const d=String(a||"").replace(/\D/g,"");

 if(d.length===12)
   return "XXXX XXXX "+d.slice(-4);

 return a||"";
}

function esc(v){

 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function render(){

 const box=document.getElementById("list");
 const q=document.getElementById("search").value.trim();

 let arr=getAll();

 if(q){

   const q1=q.toLowerCase();
   const q2=norm(q);

   arr=arr.filter(r=>
     String(r.patientName||"").toLowerCase().includes(q1) ||
     norm(r.aadhaar).includes(q2) ||
     String(r.reportType||"").toLowerCase().includes(q1)
   );

 }

 const groups={};

 arr.forEach(r=>{

   const key=(r.patientName||"Unknown Patient")
     .trim()
     .toLowerCase();

   if(!groups[key])groups[key]={
     name:r.patientName||"Unknown Patient",
     aadhaar:r.aadhaar||"",
     reports:[]
   };

   groups[key].reports.push(r);

 });

 const names=Object.keys(groups);

 if(!names.length){

   box.innerHTML=
   '<div class="empty">No published Blood Report found.</div>';

   return;
 }

 box.innerHTML=names.map((key,index)=>{

   const g=groups[key];

   return `
   <div class="folder">

     <div class="folder-head"
          onclick="toggleFolder('${index}')">

       📁 ${esc(g.name)}

       <span style="float:right">
       ${g.reports.length} Report${g.reports.length>1?"s":""}
       </span>

       <div class="small">
       Aadhaar: ${maskAadhaar(g.aadhaar)}
       </div>

     </div>

     <div class="folder-body" id="folder-${index}">

       ${g.reports.map(r=>`

       <div class="report">

         <b>🔬 ${esc(r.reportType)}</b>

         <div class="small">
         Sample Date: ${esc(r.sampleDate||"")}
         </div>

         <div class="small">
         Lab No: ${esc(r.labNo||"")}
         </div>

         <button onclick="viewReport('${r.id}')">
         👁️ View Report
         </button>

       </div>

       `).join("")}

     </div>

   </div>
   `;

 }).join("");

}

function toggleFolder(i){

 const x=document.getElementById("folder-"+i);

 if(x)
 x.style.display=x.style.display==="block"?"none":"block";

}


const REF_RANGES={
 "Hemoglobin":"Male 13.0–17.0 g/dL; Female 12.0–15.0 g/dL",
 "RBC Count":"Male 4.5–5.9 million/µL; Female 4.0–5.2 million/µL",
 "WBC Count":"4,000–11,000 /µL",
 "Platelet Count":"150,000–450,000 /µL",
 "HCT / PCV":"Male 40–52%; Female 36–48%",
 "MCV":"80–100 fL","MCH":"27–33 pg","MCHC":"32–36 g/dL",
 "RDW":"11.5–14.5%","Neutrophils":"40–70%","Lymphocytes":"20–40%",
 "Monocytes":"2–8%","Eosinophils":"1–6%","Basophils":"0–1%",
 "Fasting Blood Sugar":"70–99 mg/dL",
 "Post Prandial Blood Sugar":"<140 mg/dL",
 "Random Blood Sugar":"70–140 mg/dL",
 "HbA1c":"4.0–5.6%",
 "Estimated Average Glucose":"Approx. 70–114 mg/dL",
 "Total Cholesterol":"<200 mg/dL","Triglycerides":"<150 mg/dL",
 "HDL Cholesterol":">40 mg/dL","LDL Cholesterol":"<100 mg/dL",
 "VLDL Cholesterol":"5–40 mg/dL","TC / HDL Ratio":"Usually <5.0",
 "Total Bilirubin":"0.2–1.2 mg/dL","Direct Bilirubin":"0.0–0.3 mg/dL",
 "Indirect Bilirubin":"0.2–0.9 mg/dL","SGOT / AST":"10–40 U/L",
 "SGPT / ALT":"7–56 U/L","ALP":"44–147 U/L",
 "Total Protein":"6.0–8.3 g/dL","Albumin":"3.5–5.0 g/dL",
 "Globulin":"2.0–3.5 g/dL","Blood Urea":"15–45 mg/dL",
 "Serum Creatinine":"Male 0.7–1.3 mg/dL; Female 0.6–1.1 mg/dL",
 "Uric Acid":"Male 3.4–7.0 mg/dL; Female 2.4–6.0 mg/dL",
 "eGFR":">90 mL/min/1.73m²","Sodium":"135–145 mmol/L",
 "Potassium":"3.5–5.1 mmol/L","Chloride":"98–107 mmol/L",
 "TSH":"0.4–4.0 µIU/mL","T3":"0.8–2.0 ng/mL",
 "T4":"5.0–12.0 µg/dL","Free T3":"2.3–4.2 pg/mL",
 "Free T4":"0.8–1.8 ng/dL","Colour":"Pale yellow to yellow",
 "Appearance":"Clear","pH":"4.5–8.0","Specific Gravity":"1.005–1.030",
 "Protein":"Negative","Sugar":"Negative","Ketone":"Negative",
 "Blood":"Negative","Pus Cells":"0–5 /HPF","RBC":"0–2 /HPF",
 "Epithelial Cells":"Few","Bacteria":"None / Nil",
 "Consistency":"Formed","Occult Blood":"Negative","Mucus":"Absent",
 "Ova / Parasite":"Not seen","ESR":"Male 0–15 mm/hr; Female 0–20 mm/hr",
 "CRP":"<5 mg/L","ABO Group":"A / B / AB / O",
 "Rh Factor":"Positive / Negative","Bicarbonate":"22–29 mmol/L",
 "Total Calcium":"8.5–10.5 mg/dL","Ionized Calcium":"1.12–1.32 mmol/L",
 "Amylase":"30–110 U/L","Lipase":"0–160 U/L",
 "Test":"As applicable","Result":"Negative / Positive as applicable",
 "NS1 Antigen":"Negative","IgM Antibody":"Negative","IgG Antibody":"Negative",
 "Parasite / Antigen":"Not detected",
 "Salmonella Typhi O":"Negative / No significant titre",
 "Salmonella Typhi H":"Negative / No significant titre",
 "Salmonella Paratyphi AH":"Negative / No significant titre",
 "Salmonella Paratyphi BH":"Negative / No significant titre",
 "Test 1":"As applicable","Test 2":"As applicable","Test 3":"As applicable",
 "Test 4":"As applicable","Test 5":"As applicable","Test 6":"As applicable"
};

function viewReport(id){

 const r=getAll().find(x=>x.id===id);

 if(!r)return;

 const tests=Object.entries(r.results||{}).map(([k,v])=>{
 const range=REF_RANGES[k]||"Not specified";
 const unit={
  "Hemoglobin":"g/dL","RBC Count":"million/µL","WBC Count":"/µL",
  "Platelet Count":"/µL","HCT / PCV":"%","MCV":"fL","MCH":"pg",
  "MCHC":"g/dL","RDW":"%","Neutrophils":"%","Lymphocytes":"%",
  "Monocytes":"%","Eosinophils":"%","Basophils":"%",
  "Fasting Blood Sugar":"mg/dL","Post Prandial Blood Sugar":"mg/dL",
  "Random Blood Sugar":"mg/dL","HbA1c":"%","Estimated Average Glucose":"mg/dL",
  "Total Cholesterol":"mg/dL","Triglycerides":"mg/dL",
  "HDL Cholesterol":"mg/dL","LDL Cholesterol":"mg/dL",
  "VLDL Cholesterol":"mg/dL","Total Bilirubin":"mg/dL",
  "Direct Bilirubin":"mg/dL","Indirect Bilirubin":"mg/dL",
  "SGOT / AST":"U/L","SGPT / ALT":"U/L","ALP":"U/L",
  "Total Protein":"g/dL","Albumin":"g/dL","Globulin":"g/dL",
  "Blood Urea":"mg/dL","Serum Creatinine":"mg/dL","Uric Acid":"mg/dL",
  "eGFR":"mL/min","Sodium":"mmol/L","Potassium":"mmol/L",
  "Chloride":"mmol/L","TSH":"µIU/mL","T3":"ng/mL","T4":"µg/dL",
  "Free T3":"pg/mL","Free T4":"ng/dL","Pus Cells":"/HPF",
  "RBC":"/HPF","Epithelial Cells":"/HPF","ESR":"mm/hr","CRP":"mg/L",
  "Bicarbonate":"mmol/L","Total Calcium":"mg/dL",
  "Ionized Calcium":"mmol/L","Amylase":"U/L","Lipase":"U/L"
 }[k]||"";
 return `<tr>
   <td>${esc(k)}</td>
   <td>${esc(v)}</td>
   <td>${esc(unit)}</td>
   <td>${esc(range)}</td>
 </tr>`;
}).join("");

 const w=window.open("","_blank","width=900,height=700");

 if(!w){
   alert("Please allow pop-ups.");
   return;
 }

 w.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>${esc(r.reportType)}</title>
<style>
body{
  font-family:Arial;
  padding:25px;
  margin:0;
}

h1,h2{
  text-align:center;
}

.report-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin:20px 0;
}

.info-card{
  border:1px solid #999;
  border-radius:10px;
  padding:15px;
  box-sizing:border-box;
}

.info-card h3{
  margin:0 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid #ddd;
}

.info-card div{
  margin:7px 0;
  line-height:1.45;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

td,th{
  border:1px solid #999;
  padding:9px;
}

@media(max-width:700px){
  .report-info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<h1>SAMUI SEVA SADAN</h1>
<h2>${esc(r.reportType)}</h2>

<div class="report-info-grid">

  <div class="info-card patient-information">
    <h3>👤 Patient Information</h3>
    <div><b>Mother / Patient:</b> ${esc(r.patientName)}</div>
    <div><b>Aadhaar:</b> ${maskAadhaar(r.aadhaar)}</div>
    <div><b>Age:</b> ${esc(r.age)}</div>
    <div><b>Sex:</b> ${esc(r.sex)}</div>
    <div><b>Sample Date:</b> ${esc(r.sampleDate)}</div>
    <div><b>Lab No:</b> ${esc(r.labNo)}</div>
    <div><b>Doctor:</b> ${esc(r.doctor)}</div>
  </div>

  <div class="info-card laboratory-information">
    <h3>🏥 Laboratory Information</h3>
    ${r.laboratoryName ? `<div><b>Laboratory Name:</b> ${esc(r.laboratoryName)}</div>` : ""}
    ${r.laboratoryAddress ? `<div><b>Address:</b> ${esc(r.laboratoryAddress)}</div>` : ""}
    ${r.laboratoryPhone ? `<div><b>Phone:</b> ${esc(r.laboratoryPhone)}</div>` : ""}
    ${r.laboratoryEmail ? `<div><b>Email:</b> ${esc(r.laboratoryEmail)}</div>` : ""}
    ${r.laboratoryRegistration ? `<div><b>Registration / License No.:</b> ${esc(r.laboratoryRegistration)}</div>` : ""}
  </div>

</div>

<table>
<tr><th>Test Name</th><th>Result</th><th>Unit</th><th>Reference Range</th></tr>
${tests}
</table>

<p><b>Remarks:</b><br>${esc(r.remarks)}</p>

<button onclick="window.print()">🖨️ Print</button>

</body>
</html>
`);

 w.document.close();

}

render();

window.addEventListener("storage",render);
// setInterval(render,1500);

</script>

</body>
</html>
