<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - SAMUI SEVA SADAN</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8f9;
  color:#123;
}

.header{
  background:#087f8c;
  color:#fff;
  padding:22px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:500px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  padding:28px 24px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.card h2{
  text-align:center;
  color:#087f8c;
  margin:0 0 25px;
  font-size:30px;
}

label{
  display:block;
  margin:16px 0 7px;
  font-size:18px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
}

.login-btn{
  width:100%;
  margin-top:24px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#087f8c;
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

.error{
  color:#d32f2f;
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

.forgot{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#087f8c;
  font-size:18px;
  font-weight:bold;
  text-decoration:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#555;
  text-decoration:none;
  font-size:17px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🔐 ADMIN PANEL</h1>
  <p>SAMUI SEVA SADAN NURSING HOME</p>
</div>

<div class="container">

<div class="card">

<h2>Admin Login</h2>

<form id="loginForm">

<label>👤 Admin Name / Username</label>

<input
  type="text"
  id="username"
  placeholder="Enter Admin Name"
  required
>

<label>🔑 Password</label>

<input
  type="password"
  id="password"
  placeholder="Enter Password"
  required
>

<button class="login-btn" type="submit">
🔐 LOGIN
</button>

<div class="error" id="error"></div>

</form>

<a class="forgot" href="forgot-password.html">
❓ Forgot Password?
</a>

<a class="back" href="settings.html">
← Back to Settings
</a>

</div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  error.textContent = "Checking login...";

  try {

    const res = await fetch("/api/admin-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: username,
        password: password
      })
    });

    const data = await res.json();

    if(data.ok){

      localStorage.setItem("sssAdminLoggedIn", "true");

      window.location.href = "admin-dashboard.html";

    }else{

      error.textContent =
        "❌ " + (data.message || "Invalid Admin Name or Password");

    }

  } catch(e) {

    console.error("Admin login error:", e);

    error.textContent =
      "❌ " + (e.message || "Server connection error.");

  }

});
</script>

</body>
</html>
