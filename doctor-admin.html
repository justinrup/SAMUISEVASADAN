<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Doctors - SAMUI SEVA SADAN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fa;
 color:#222;
}
.header{
 padding:22px 15px;
 text-align:center;
 background:#fff;
 border-bottom:1px solid #ddd;
}
.header h1{margin:0 0 6px}
.container{
 max-width:1000px;
 margin:auto;
 padding:20px;
}
.doctor-card{
 background:#fff;
 border-radius:14px;
 padding:18px;
 margin-bottom:16px;
 box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.doctor-card img{
 width:110px;
 height:110px;
 object-fit:cover;
 border-radius:50%;
 display:block;
 margin:0 auto 12px;
}
.doctor-card h2{
 text-align:center;
 margin:8px 0;
}
.doctor-card p{
 margin:7px 0;
 line-height:1.5;
}
.serial{
 font-weight:bold;
 font-size:18px;
 margin-bottom:8px;
}
.print-btn{
 padding:9px 15px;
 border:0;
 border-radius:7px;
 cursor:pointer;
}
.empty{
 text-align:center;
 padding:35px;
 background:#fff;
 border-radius:12px;
}
</style>
</head>

<body>

<div class="header">
<h1>👨‍⚕️ ADD ON DOCTOR</h1>
<p>SAMUI SEVA SADAN NURSING HOME</p>
</div>

<div class="container" id="doctorList"></div>

<script>

const records =
 JSON.parse(localStorage.getItem("sss_doctors") || "[]");

const published =
 records.filter(d=>d.published===true);

const box=document.getElementById("doctorList");

function safe(v){
 return String(v ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

if(!published.length){

 box.innerHTML=`
 <div class="empty">
   <h2>No Doctor Published</h2>
   <p>Published doctors will appear here.</p>
 </div>`;

}else{

 published.forEach((d,i)=>{

   const card=document.createElement("div");
   card.className="doctor-card";

   card.innerHTML=`

   ${d.photo ? `<img src="${safe(d.photo)}">` : ""}

   <div class="serial">Doctor Serial No. ${i+1}</div>

   <h2>${safe(d.doctorName)}</h2>

   <p><b>Qualification:</b> ${safe(d.qualification)}</p>
   <p><b>Specialist:</b> ${safe(d.specialist)}</p>
   <p><b>Hospital:</b> ${safe(d.hospital)}</p>
   <p><b>Chamber Time:</b> ${safe(d.chamberTime)}</p>
   <p><b>Chamber Days:</b> ${safe((d.chamberDays||[]).join(", "))}</p>
   <p><b>Appointment Phone:</b> ${safe(d.phone)}</p>
   <p><b>Clinic Name:</b> ${safe(d.clinic)}</p>

   <button class="print-btn"
   onclick="printDoctor(${i})">
   🖨️ Print
   </button>
   `;

   box.appendChild(card);
 });
}

function printDoctor(index){

 const d=published[index];

 const w=window.open("","_blank");

 w.document.write(`
 <html>
 <head>
 <title>Doctor Information</title>
 <style>
 body{font-family:Arial;padding:25px;line-height:1.8}
 h2{text-align:center}
 </style>
 </head>
 <body>
 <h2>👨‍⚕️ DOCTOR INFORMATION</h2>
 <p><b>Doctor Name:</b> ${safe(d.doctorName)}</p>
 <p><b>Qualification:</b> ${safe(d.qualification)}</p>
 <p><b>Specialist:</b> ${safe(d.specialist)}</p>
 <p><b>Hospital:</b> ${safe(d.hospital)}</p>
 <p><b>Chamber Time:</b> ${safe(d.chamberTime)}</p>
 <p><b>Chamber Days:</b> ${safe((d.chamberDays||[]).join(", "))}</p>
 <p><b>Appointment Phone:</b> ${safe(d.phone)}</p>
 <p><b>Clinic Name:</b> ${safe(d.clinic)}</p>
 </body>
 </html>
 `);

 w.document.close();
 w.focus();
 w.print();
}

</script>

</body>
</html>
